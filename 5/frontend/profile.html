
<!DOCTYPE html><html lang='en'><head>
<meta charset='utf-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/>
<title>Mitra • Profile</title>
<link rel='stylesheet' href='style.css'/>
<script defer src='config.js'></script>
<script defer src='shared.js'></script>
</head><body>
<div class="bg particles"></div>
<header class="header glass">
  <div class="brand"><div class="dot"></div><div>MeMetrics</div><div>•</div><div class="mitra">Mitra</div></div>
  <div style="color:var(--muted)">Profile</div>
</header>

<main class="container">
  <section class="card glass">
    <div class="who">
      <div class="avatar"></div>
      <div><div class="name">You</div><div class="meta">Student • Software</div></div>
    </div>
  </section>

  <section class="grid">
    <div class="card glass">
      <h2>Your DVI</h2>
      <div class="gaugeWrap">
        <svg viewBox="0 0 120 70" class="gauge">
          <defs>
            <linearGradient id="grad" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stop-color="#00C2A8"/>
              <stop offset="50%" stop-color="#3461FF"/>
              <stop offset="100%" stop-color="#7C4DFF"/>
            </linearGradient>
          </defs>
          <path d="M10 60 A50 50 0 0 1 110 60" stroke="url(#grad)" stroke-width="12" fill="none" opacity="0.3"/>
          <path id="needle" d="M10 60 A50 50 0 0 1 110 60" stroke="url(#grad)" stroke-width="12" fill="none" stroke-dasharray="157" stroke-dashoffset="157"/>
        </svg>
        <div class="score" id="dviScore">—</div>
        <div class="grade" id="dviGrade">—</div>
      </div>
      <div class="drivers" id="drivers"></div>
    </div>

    <div class="card glass">
      <h2>Highlights</h2>
      <ul class="offers" id="offersList"><li>—</li></ul>
      <p class="tip">Tip: add one certification for +~25 DVI.</p>
    </div>
  </section>
</main>

<div class="bottomnav">
  <div class="wrap">
    <a class="navbtn" href="index.html"><div class="icon">💬</div><div class="label">Feed</div></a>
    <a class="navbtn active" href="profile.html"><div class="icon">👤</div><div class="label">Profile</div></a>
    <a class="navbtn" href="opportunities.html"><div class="icon">💼</div><div class="label">Opportunities</div></a>
    <a class="navbtn" href="improve.html"><div class="icon">⚡</div><div class="label">Improve</div></a>
  </div>
</div>

<footer>© <span id="year"></span> MeMetrics • Powered by Mitra</footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
(async()=>{
  try{
    const data=await mitraPredict({skills_index:0.62,learning_pace:0.61,certifications:1,project_score:0.55,financial_behavior:0.5,resilience_score:0.62});
    document.getElementById('dviScore').textContent=data.dvi;
    document.getElementById('dviGrade').textContent=data.grade;
    setGauge01((data.dvi-300)/600);
    const drivers = Object.entries(data.drivers).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><strong>${k}</strong> • ${v}%</div>`).join('');
    document.getElementById('drivers').innerHTML=drivers;
    const offers=[];
    if(data.dvi>=760){offers.push('€5,000 scholarship match • Top tier');offers.push('Low-APR micro-loan pre-approved');}
    else if(data.dvi>=680){offers.push('€2,000 micro-loan available');offers.push('Interview fast-track with partners');}
    else if(data.dvi>=600){offers.push('Foundation scholarship shortlist');}
    else {offers.push('Complete 1 certification (+~25 DVI)');}
    document.getElementById('offersList').innerHTML=offers.map(o=>`<li>${o}</li>`).join('');
  }catch(e){}
})();
</script>
</body></html>
